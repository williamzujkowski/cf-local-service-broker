---
name: release

# Triggered by pushing an annotated tag like `v0.1.3`. Publishes:
#   1. postgres-broker-linux-amd64 + minio-broker-linux-amd64 + SHA256SUMS
#      as GitHub Release assets (consumed by homelab-iac cf push flow)
#   2. ghcr.io/<owner>/<broker>:<tag> + :latest multi-arch (amd64+arm64)
#      docker images (consumed by `cf push` with docker.image: in manifest)
#
# Mirrors the bosh-pgvector-release pattern: strict semver, deny-write by
# default, idempotent re-runs, workflow_dispatch dry-run target.
#
# Tracking: williamzujkowski/homelab-iac#596 (where this is consumed)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v). Used for dry-run testing without creating a GitHub Release.'
        required: true
        default: '0.0.0-dryrun'

# Default deny-write; jobs opt-in to the specific scope they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.24'

jobs:
  binaries:
    name: Build and publish broker binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # gh release create / gh release upload
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Derive version from tag or input
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "ERROR: version '${VERSION}' is not strict semver"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build linux-amd64 binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o out/postgres-broker-linux-amd64 ./cmd/postgres-broker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o out/minio-broker-linux-amd64 ./cmd/minio-broker
          ls -lh out/

      - name: Generate SHA256SUMS
        working-directory: out
        run: |
          sha256sum postgres-broker-linux-amd64 minio-broker-linux-amd64 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifact (workflow_dispatch dry-runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cf-local-service-broker-${{ steps.version.outputs.version }}-binaries
          path: |
            out/postgres-broker-linux-amd64
            out/minio-broker-linux-amd64
            out/SHA256SUMS
          retention-days: 14

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/notes.md <<EOF
          OSBAPI service broker binaries for cf-local-service-broker ${VERSION}.

          Two brokers in one release: \`postgres-broker\` (postgresql-local
          service offering with shared + pgvector plans) and \`minio-broker\`
          (s3-local service offering). Both are static linux/amd64 Go
          binaries.

          ## Install (binary)

          \`\`\`bash
          curl -fsSLO https://github.com/${REPO}/releases/download/${TAG}/postgres-broker-linux-amd64
          curl -fsSLO https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS
          sha256sum -c SHA256SUMS
          chmod +x postgres-broker-linux-amd64
          \`\`\`

          ## Install (docker image — multi-arch)

          \`\`\`
          ghcr.io/${{ github.repository_owner }}/postgres-broker:${TAG}
          ghcr.io/${{ github.repository_owner }}/minio-broker:${TAG}
          \`\`\`

          See [README.md](https://github.com/${REPO}/blob/${TAG}/README.md) for usage.
          EOF

          PRERELEASE_FLAG=""
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Idempotent: clobber assets if the release already exists
          # (e.g. tag force-pushed).
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; clobbering assets and refreshing notes"
            gh release upload "${TAG}" --clobber \
              out/postgres-broker-linux-amd64 \
              out/minio-broker-linux-amd64 \
              out/SHA256SUMS
            gh release edit "${TAG}" --notes-file /tmp/notes.md
          else
            # shellcheck disable=SC2086
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file /tmp/notes.md \
              ${PRERELEASE_FLAG} \
              out/postgres-broker-linux-amd64 \
              out/minio-broker-linux-amd64 \
              out/SHA256SUMS
          fi

  docker:
    name: Build and push multi-arch docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write   # docker push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        broker:
          - { name: postgres-broker, dockerfile: Dockerfile.postgres }
          - { name: minio-broker,    dockerfile: Dockerfile.minio }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Derive version from tag or input
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "ERROR: version '${VERSION}' is not strict semver"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU (arm64 emulation for buildx)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: ${{ matrix.broker.dockerfile }}
          platforms: linux/amd64,linux/arm64
          # workflow_dispatch builds but doesn't push (dry-run).
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.broker.name }}:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.broker.name }}:latest
          # OCI labels per https://github.com/opencontainers/image-spec/blob/main/annotations.md
          labels: |
            org.opencontainers.image.title=${{ matrix.broker.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.broker.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.broker.name }}
